<!-- index.html -->
<!doctype html>

<!-- DEFINE OUR ANGULAR MODULE contactList -->
<html ng-app="contactList">
<head>
    <!-- META -->
    <meta charset="utf-8">
    <!-- Optimize the view on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact List</title>

    <!-- CSS -->
    <!-- Load Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <style>
        html                    { overflow-y:scroll; }
        body                    { padding-top:50px; }
        #contact-list           { margin-bottom:30px; }
        form button             { margin-top: 25px; }
        form .form-group:first-child { padding-left: 0; }
    </style>

    <!-- JS -->
    <!-- Load the AngularJS library -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="angularApp.js"></script>

</head>
<!-- DEFINE THE CONTROLLER AND GET ALL THE CONTACTS -->
<body ng-controller="mainController">
    <div class="container">

        <!-- HEADER AND TOTAL OF CONTACTS -->
        <div class="jumbotron text-center">
            <h1>Contact List <span class="label label-info">{{ contacts.length }}</span></h1>
        </div>

        <!-- LIST OUR CONTACTS -->
        <div id="contact-list">
            <table class="table table-striped">

                <tr>
                    <th>Name</th>
                    <th>E-mail</th>
                    <th>Phone</th>
                    <th>Options</th>
                </tr>

                <!-- LOOP TO SHOW ALL THE CONTACTS IN $scope.contacts -->
                <tr ng-repeat="contact in contacts">
                    <td>{{ contact.name }}</td>
                    <td>{{ contact.email }}</td>
                    <td>{{ contact.phone }}</td>
                    <td>
                        <button type="button" class="btn btn-default" ng-click="editContact(contact._id)">Edit</button>
                        <button type="button" class="btn btn-primary" ng-click="deleteContact(contact._id)">Remove</button>
                    </td>
                </tr>

            </table>
        </div>

        <!-- FORM TO CREATE A NEW CONTACT -->
        <div id="contact-form">
            <hr>
            <form>
                <div class="form-group col-md-3">
                    <label for="contactName">Name</label>
                    <input type="text" class="form-control" id="contactName" placeholder="First Last" ng-model="formContact.name">
                </div>
                <div class="form-group col-md-3">
                    <label for="contactEmail">E-mail</label>
                    <input type="text" class="form-control" id="contactEmail" placeholder="example@example.com" ng-model="formContact.email">
                </div>
                <div class="form-group col-md-3">
                    <label for="contactPhone">Phone</label>
                    <input type="text" class="form-control" id="contactPhone" placeholder="(00) 0000-0000" ng-model="formContact.phone">
                </div>
                <div class="form-group col-md-3">
                    <button type="submit" class="btn btn-primary" ng-click="createContact()">Create</button>
                    <button type="submit" class="btn btn-info" ng-click="updateContact()">Update</button>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
